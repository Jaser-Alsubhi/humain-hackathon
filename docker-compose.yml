services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-devpassword}
      MYSQL_DATABASE: hackdb
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-devpassword}"]
      interval: 5s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    restart: on-failure
    environment:
      DATABASE_URL: mysql+pymysql://root:${DB_PASSWORD:-devpassword}@db:3306/hackdb
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  dbdata:
